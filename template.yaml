AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sample durable function instrumented with the OpenTelemetry plugin for the AWS Durable Execution SDK

Parameters:
  AdotLayerArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:615299751070:layer:AWSOpenTelemetryDistroPython:30
    Description: ADOT Python Lambda layer ARN for the deployment region and architecture

Globals:
  Function:
    Runtime: python3.13
    Timeout: 900
    MemorySize: 512

Resources:
  DurableOtelTestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: durable-otel-sample
      Handler: index.handler
      CodeUri: src/
      AutoPublishAlias: live
      Tracing: Active
      # This sample uses x86_64. Supply a compatible AdotLayerArn if adapting
      # the template to another architecture or region.
      Architectures:
        - x86_64
      Layers:
        - !Ref AdotLayerArn
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/otel-instrument
          # This sample exports traces to X-Ray but does not enable CloudWatch
          # Application Signals, whose managed policy is not attached below.
          OTEL_AWS_APPLICATION_SIGNALS_ENABLED: 'false'
      Policies:
        - AWSLambdaBasicDurableExecutionRolePolicy
        - AWSXRayDaemonWriteAccess
      DurableConfig:
        ExecutionTimeout: 900

Outputs:
  FunctionName:
    Description: Function name (use for invoke and callback commands)
    Value: !Ref DurableOtelTestFunction
  FunctionArn:
    Description: Function ARN
    Value: !GetAtt DurableOtelTestFunction.Arn
