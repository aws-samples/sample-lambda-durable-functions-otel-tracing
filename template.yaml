AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sample durable function instrumented with the OpenTelemetry plugin for the AWS Durable Execution SDK

Globals:
  Function:
    Runtime: python3.13
    Timeout: 900
    MemorySize: 512

Resources:
  DurableOtelTestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: durable-otel-sample
      Handler: index.handler
      CodeUri: src/
      AutoPublishAlias: live
      Tracing: Active
      # The ADOT layer is amd64-only; pin the architecture so an arm64 deploy
      # fails fast instead of silently mismatching the layer.
      Architectures:
        - x86_64
      Layers:
        # ADOT Python Lambda layer. Publisher account (901920570463) and version
        # come from the ADOT Lambda layer ARN table:
        # https://aws-otel.github.io/docs/getting-started/lambda/lambda-python
        - !Sub arn:aws:lambda:${AWS::Region}:901920570463:layer:aws-otel-python-amd64-ver-1-25-0:1
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/otel-instrument
      Policies:
        - AWSXRayDaemonWriteAccess
        # Scoped to this function's durable-execution callbacks only (least privilege).
        # Lambda authorizes callback requests against the durable execution ARN:
        # https://docs.aws.amazon.com/lambda/latest/dg/durable-security.html
        # NOTE: in this sample the *operator's CLI* sends the callback, not the
        # function itself (src/index.py only logs the command). If your resume
        # path never calls SendDurableExecutionCallbackSuccess from within the
        # function, this grant can be removed from the execution role entirely.
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - lambda:SendDurableExecutionCallbackSuccess
              # Literal function name (not !Ref) to avoid a Function->Role->Function
              # circular dependency; matches the hardcoded FunctionName above.
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:durable-otel-sample:*
      DurableConfig:
        ExecutionTimeout: 900

Outputs:
  FunctionName:
    Description: Function name (use for invoke and callback commands)
    Value: !Ref DurableOtelTestFunction
  FunctionArn:
    Description: Function ARN
    Value: !GetAtt DurableOtelTestFunction.Arn
